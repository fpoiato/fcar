name: aws-oidc-check

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    environment: prod-deploy
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::986873053420:role/fcar-gha-deploy
          aws-region: us-east-1
      - run: aws sts get-caller-identity
