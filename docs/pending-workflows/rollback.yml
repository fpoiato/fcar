name: rollback

# Swap reverso: devolve a produção à cor inativa (a anterior). Exige aprovação no prod-swap.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: prod-swap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::986873053420:role/fcar-gha-deploy
          aws-region: us-east-1
      - name: Swap reverso
        run: |
          ACTIVE=$(aws ssm get-parameter --name /fcar/active-color --query Parameter.Value --output text)
          if [ "$ACTIVE" = "blue" ]; then TARGET=green; else TARGET=blue; fi
          echo "Rollback: $ACTIVE -> $TARGET"
          bash infra/scripts/swap.sh "$TARGET"
